<div class="viewer" *ngIf=isViewerWindow>
  TO VIEW ALL INSTALLED APPs
</div>

<div class="window" *ngIf=isPropertyWindow>
  
  <!-- Window body -->
  
  <div id="row" class="content">
    <div id="column1" class="icon" [style.background-image]="iconImage == null ? undefined : iconImage| cssUrl">
    </div>
      <div id="column2" >
      <p class="app-name">
       Create a shortcut
      </p>
      <p class="shortcuts-value" style="margin-top: 0em;">
        <span class="constant">Name</span>:
      </p>
      <div class="div-input">
        <input type="text" [(ngModel)]="appName" placeholder='i.e. "My Shortcut"'/>
      </div>
      <p class="shortcuts-value" style="margin-top: 0em;">
        <span class="constant">App Identifier</span>:
      </p>
      <div class="div-input">
        <input type="text" [(ngModel)]="appId" placeholder='i.e. "org.zowe.myapp"'/>
      </div>
      <p class="shortcuts-value">
        <span class="constant">Action</span>:
      </p> 
      <div class="div-input">
        <input type="text" placeholder='i.e. "bookmark"'/>
      </div>
      <p class="shortcuts-value">
        <span class="constant">Context</span>:
      </p>
      <textarea class="server-response" placeholder='i.e. {{ "{" }}"data": "..."' style="margin-right: 1em; min-height: 75px;"
      [(ngModel)]="appContext"></textarea>
    </div>
  </div>
  <button type="submit" 
        class="shortcuts-button" style="position: absolute;margin-left: 10px;margin-top: -40px;z-index: 1;"
        (click)="createShortcut()">Create
      </button>
</div>
