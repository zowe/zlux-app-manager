<div class="launch-widget"
     [style.background]="color.launchbarColor"
     [style.border-radius]="borderRadius">
  <div class="mvd-launchbar-icon mvd-launchbar-icon-large launchbar-menu-icon"
       [style.width]="menuIconSize"
       [style.height]="menuIconSize"
       (click)="activeToggle()"
       id="ZAP_DesktopHome_ZoweStart"></div>
</div>

<ng-template [ngIf]="isActive">
  <div class="launch-widget-popup"
       [style.background]="color.launchbarMenuColor"
       [style.color]="color.launchbarMenuText"
       [style.width]="menuWidth"
       [style.bottom]="menuBottom"
       (click)="setSearchFocus();">
    <div style="cursor: pointer" 
      class="refresh-plugins" 
      (click)="refresh()"
      id="ZAP_DesktopHome_RefreshApplications">
      {{translation.translate("Refresh Applications")}}
      <em style="padding: 5px" class="fa fa-refresh" (click)="refresh()"></em>
    </div>
    <div style="margin: 20px"></div>
    <div #menudiv class="launch-menu-scroller"
         [style.background]="color.launchbarMenuColor"
         [style.width]="menuWidthInner"
         [style.color]="color.launchbarMenuText">
      <div class="launch-widget-row" 
        *ngFor="let item of displayItems | sortBy: 'label'; let i = index;" 
        (click)="clicked(item)" 
        [title]="item.tooltip" 
        (contextmenu)="onRightClick($event, item)"
        [class.active]="i==this.activeIndex" 
        (mouseover)="this.activeIndex=i">
          <div class="icon"
              [style.width]="appIconSize"
              [style.height]="appIconSize"
              [style.background-image]="'url('+item.image+')'"></div>
          <div class="app-label"
              [style.padding-top]="appLabelPadding"
              [style.font-size]="menuText">{{item.label}}</div>
      </div>
      <!-- User-created folders section -->
      <div *ngIf="folders.length > 0" class="launch-menu-folders-divider"></div>
      <div class="launch-widget-row launch-widget-folder-row"
        *ngFor="let folder of folders"
        (click)="folderClicked(folder)"
        (contextmenu)="onFolderRightClick($event, folder)"
        [title]="folder.name">
          <div class="icon launch-menu-folder-icon"
              [style.width]="appIconSize"
              [style.height]="appIconSize">
            <em class="fa fa-folder" [style.font-size]="appIconSize"></em>
          </div>
          <div class="app-label"
              [style.padding-top]="appLabelPadding"
              [style.font-size]="menuText">{{folder.name}}</div>
      </div>
      <!-- Shipped (plugin-provided) folders section -->
      <div *ngIf="shippedFolders.length > 0" class="launch-menu-folders-divider"></div>
      <ng-container *ngFor="let sFolder of shippedFolders">
        <div class="launch-menu-shipped-folder-group" [class.expanded]="expandedShippedFolderName === sFolder.name">
          <div class="launch-widget-row launch-widget-shipped-folder-row"
            (click)="toggleShippedFolder(sFolder)"
            [title]="sFolder.name"
            [class.expanded]="expandedShippedFolderName === sFolder.name">
              <div class="icon launch-menu-folder-icon"
                  [style.width]="appIconSize"
                  [style.height]="appIconSize">
                <em class="fa fa-folder-open" *ngIf="expandedShippedFolderName === sFolder.name" [style.font-size]="appIconSize"></em>
                <em class="fa fa-folder" *ngIf="expandedShippedFolderName !== sFolder.name" [style.font-size]="appIconSize"></em>
              </div>
              <div class="app-label"
                  [style.padding-top]="appLabelPadding"
                  [style.font-size]="menuText">{{sFolder.name}}</div>
          </div>
          <div class="launch-menu-shipped-folder-items" *ngIf="expandedShippedFolderName === sFolder.name">
            <div class="launch-widget-row launch-widget-shipped-item-row"
              *ngFor="let sItem of sFolder.items"
              (click)="onShippedFolderItemClicked(sItem); $event.stopPropagation()"
              [title]="sItem.title || sItem.id || sItem.dest || ''">
                <div class="icon launch-menu-shipped-item-icon"
                    [style.width]="appIconSize"
                    [style.height]="appIconSize">
                  <em [class]="getShippedFolderItemIcon(sItem)" [style.font-size]="appIconSize"></em>
                </div>
                <div class="app-label"
                    [style.padding-top]="appLabelPadding"
                    [style.font-size]="menuText">{{sItem.title || sItem.id || sItem.dest}}</div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
    <div class="launch-menu-search">
      <em class="launch-menu-search-icon fa fa-search"></em>
      <input #searchapp class="launch-menu-search-input" type="text" 
        placeholder="{{translation.translate('Search')}}"
        [style.font-size]="menuText"
        [style.color]="color.launchbarMenuText"
        [(ngModel)]="appFilter"
        (input)="filterMenuItems()"
        id="ZAP_DesktopHome_SearchApplications">
    </div>
  </div>
</ng-template>
