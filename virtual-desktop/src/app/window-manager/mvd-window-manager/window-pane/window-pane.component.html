<div class="window-pane" [ngStyle]="wallpaper" id="ZAP_DesktopHome_Wallpaper" (click)="onDesktopClick()" (contextmenu)="onDesktopRightClick($event)" (mousedown)="onDesktopMouseDown($event)">
  <rs-com-desktop-icon
    *ngFor="let shortcut of topLevelShortcuts"
    [shortcut]="shortcut"
    [plugin]="getPluginForShortcut(shortcut)"
    [isHighlighted]="isItemSelected(getShortcutKey(shortcut)) || highlightedIconId === getShortcutKey(shortcut)"
    [showFolderPreview]="folderPreviewTargetKey === getShortcutKey(shortcut)"
    [folderPreviewIcons]="folderPreviewIcons"
    [allShortcuts]="topLevelShortcuts"
    [maxGridRows]="maxGridRows"
    [maxGridCols]="maxGridCols"
    [iconCellWidth]="iconCellWidth"
    [iconCellHeight]="iconCellHeight"
    [iconImageSize]="iconImageSize"
    [iconFontSize]="iconFontSize"
    [iconLetterSize]="iconLetterSize"
    [gridPadding]="gridPadding"
    [shouldRename]="renameTargetKey === getShortcutKey(shortcut)"
    (iconSelected)="onIconSelected($event)"
    (iconClicked)="onIconClicked($event)"
    (iconLaunched)="onIconLaunched($event)"
    (iconContextMenu)="onIconContextMenu($event)"
    (iconMoved)="onIconMoved($event)"
    (iconRenamed)="onIconRenamed($event)"
    (iconRenameCancelled)="onIconRenameCancelled($event)"
    (iconDragMove)="onIconDragMove($event)"
    (iconDragEnd)="onIconDragEnd($event)">
  </rs-com-desktop-icon>
  <rs-com-desktop-folder
    *ngFor="let folder of folders"
    [folder]="folder"
    [childShortcuts]="getShortcutsInFolder(folder.id)"
    [pluginMap]="pluginMap"
    [isHighlighted]="isItemSelected('folder:' + folder.id) || highlightedFolderId === folder.id || dragOverFolderId === folder.id"
    [isOpen]="openFolderId === folder.id"
    [allFolders]="folders"
    [allShortcuts]="shortcuts"
    [maxGridRows]="maxGridRows"
    [maxGridCols]="maxGridCols"
    [iconCellWidth]="iconCellWidth"
    [iconCellHeight]="iconCellHeight"
    [iconImageSize]="iconImageSize"
    [iconFontSize]="iconFontSize"
    [iconLetterSize]="iconLetterSize"
    [gridPadding]="gridPadding"
    [shouldRename]="renameFolderTargetId === folder.id"
    (folderSelected)="onFolderSelected($event)"
    (folderClicked)="onFolderClicked($event)"
    (folderOpened)="onFolderOpened($event)"
    (folderContextMenu)="onFolderContextMenu($event)"
    (folderMoved)="onFolderMoved($event)"
    (folderRenamed)="onFolderRenamed($event)"
    (folderRenameCancelled)="onFolderRenameCancelled($event)"
    (shortcutLaunched)="onIconLaunched($event)"
    (shortcutRemovedFromFolder)="onShortcutRemovedFromFolder($event)"
    (shortcutDraggedOutToDesktop)="onShortcutDraggedOutOfFolder($event)"
    (shortcutReordered)="onShortcutReordered($event)"
    (shortcutContextMenu)="onIconContextMenu($event)">
  </rs-com-desktop-folder>
  <div *ngIf="marqueeActive" class="marquee-selection" [ngStyle]="marqueeStyle"></div>
  <div *ngFor="let window of windows">
    <rs-com-mvd-window [desktopWindow]="window" [theme]="theme"></rs-com-mvd-window>
  </div>
</div>

<rs-com-shortcut-properties
  *ngIf="propertiesShortcut"
  [shortcut]="propertiesShortcut"
  [plugin]="pluginMap.get(propertiesShortcut.pluginId)"
  (closed)="onPropertiesClosed()"
  (iconChanged)="onPropertiesIconChanged($event)"
  (launchMetadataChanged)="onPropertiesLaunchMetadataChanged($event)">
</rs-com-shortcut-properties>
