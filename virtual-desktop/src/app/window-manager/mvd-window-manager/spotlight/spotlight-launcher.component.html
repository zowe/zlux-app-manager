<div class="spotlight-backdrop" (click)="onBackdropClick($event)">
  <div class="spotlight-panel"
    #spotlightPanel
    [class.is-dragging]="isDragging"
    [class.is-resizing]="isResizing"
    [style.left.px]="panelX"
    [style.top.px]="panelY"
    [style.width.px]="panelW"
    [style.height]="panelH > 0 ? panelH + 'px' : 'auto'"
    [style.max-height]="panelH > 0 ? 'none' : maxAutoHeight + 'px'"
    (mousedown)="onDragStart($event)"
  >
    <!-- Search Input -->
    <div class="spotlight-input-wrapper">
      <i class="fa fa-search spotlight-search-icon"></i>
      <div class="spotlight-input-container">
        <input
          #searchInput
          type="text"
          class="spotlight-input"
          [class.has-query]="query.length > 0"
          [style.width]="query.length > 0 ? (query.length + 1) + 'ch' : ''"
          [value]="query"
          (input)="onInputChange($event)"
          (keydown)="onKeyDown($event)"
          placeholder="Search or prefix: /job /dataset /uss /app /tso /mvs /api"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="spotlight-ghost-text" *ngIf="ghostText"><span class="spotlight-ghost-typed">{{query}}</span>{{ghostText}}</span>
      </div>
      <span class="spotlight-shortcut-hint" *ngIf="!query">
        <kbd>Esc</kbd> to close
      </span>
      <i class="fa fa-spinner fa-spin spotlight-spinner" *ngIf="isLoading"></i>
    </div>

    <!-- Results -->
    <div class="spotlight-results" *ngIf="flatResults.length > 0 || (hasSearched && !isLoading)">
      <ng-container *ngIf="flatResults.length > 0">
        <div class="spotlight-category-group" *ngFor="let group of groups">
          <div class="spotlight-category-header">
            <i [class]="group.icon"></i>
            <span>{{ group.category }}</span>
            <span class="spotlight-clear-all"
              *ngIf="isHistoryGroup(group)"
              (click)="clearAllHistory(group); $event.stopPropagation()">
              Clear history
            </span>
          </div>
          <div
            *ngFor="let result of group.results"
            class="spotlight-result-item"
            [class.active]="isActive(result)"
            (click)="selectResult(result)"
            (mouseenter)="activeIndex = getResultIndex(result)"
          >
            <img
              *ngIf="result.icon"
              [src]="result.icon"
              class="spotlight-result-icon-img"
              (error)="result.icon = undefined"
            />
            <i *ngIf="!result.icon" class="spotlight-result-icon" [ngClass]="getCategoryIconClass(result.category)"></i>
            <div class="spotlight-result-text">
              <span class="spotlight-result-label">{{ result.label }}</span>
              <span class="spotlight-result-desc" *ngIf="result.description && !result.output">{{ result.description }}</span>
              <pre class="spotlight-tso-output" *ngIf="result.output">{{ result.output }}</pre>
            </div>
            <i class="fa fa-times spotlight-history-remove"
              *ngIf="result.historyItem"
              title="Remove from history"
              (click)="removeHistoryItem(result); $event.stopPropagation()">
            </i>
          </div>
        </div>
      </ng-container>

      <div class="spotlight-no-results" *ngIf="flatResults.length === 0 && hasSearched && !isLoading">
        <i class="fa fa-info-circle"></i>
        <span>No results found for "{{ query }}"</span>
      </div>
    </div>

    <!-- Hints footer -->
    <div class="spotlight-footer" *ngIf="flatResults.length > 0">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Navigate</span>
      <span *ngIf="flatResults[activeIndex]?.pendingExecution"><kbd>Enter</kbd> Execute</span>
      <span *ngIf="flatResults[activeIndex]?.output"><kbd>Enter</kbd> Copy output</span>
      <span *ngIf="activeIndex >= 0 && !flatResults[activeIndex]?.output && !flatResults[activeIndex]?.pendingExecution"><kbd>Enter</kbd> Open</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>

    <!-- Resize handles -->
    <div class="spotlight-resize-handle spotlight-resize-br" (mousedown)="onResizeStart($event, 'br')"></div>
    <div class="spotlight-resize-handle spotlight-resize-bl" (mousedown)="onResizeStart($event, 'bl')"></div>
  </div>
</div>
