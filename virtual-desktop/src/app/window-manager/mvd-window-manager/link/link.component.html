<div class="link" (click)="openLink()" (contextmenu)="showOptions($event)" [style.width]="parentWidth" [style.height]="parentHeight" [style.margin]="margin">
  <div class="icon" [style.background-image]="icon" [style.width]="iconSize" [style.height]="iconSize"></div>
  <p class="launchbar-caption label" style="position: inherit; display:inline-flex; width:unset; z-index: unset;">{{name}}</p>
</div>
